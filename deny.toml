# cargo-deny configuration for the miden-cov workspace

# Graph configuration
[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

# Advisory database configuration
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
ignore = [
    "RUSTSEC-2024-0436", # paste is unmaintained but no alternative available (via miden-debug-types)
]

# License configuration
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "Unicode-3.0",
    "MPL-2.0",
    "Zlib",
]
exceptions = [
    # Each entry is the crate and version constraint, and its specific allowed licenses
    #{ allow = ["Zlib"], name = "adler32", version = "*" },
]

# Bans configuration
[bans]
multiple-versions = "deny"
wildcards = "allow"
highlight = "all"
allow = [
    #{ name = "ansi_term", version = "=0.11.0" },
]
deny = [
    #{ name = "ansi_term", version = "=0.11.0" },
]
skip = [
    # Allow duplicate spin versions - transitively pulled by the Miden VM crates
    { name = "spin" },
    # Allow duplicate num-bigint versions - miden-field depends directly on
    # 0.5.x to match p3-field's BigUint type, while miden-crypto still pulls 0.4.x
    { name = "num-bigint" },
    # Allow syn v2.x next to v3.x - curve25519-dalek-derive (via miden-crypto)
    # still uses v2 while thiserror-impl moved to v3
    { name = "syn", version = "2" },
]
skip-tree = [
    # Allow rustc_version v0.2.x - build dependency of miden-miette
    { name = "rustc_version", version = "=0.2.3" },
    # Allow unicode-width v0.1.x - miden-miette vs miden-formatting conflict
    { name = "unicode-width", version = "=0.1.14" },
    # Allow syn v1.x - the Miden VM derive macros still use it
    { name = "syn", version = "=1.0.109" },
]

# Sources configuration
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Temporary: the collector builds against an unreleased debugger engine (#6, #7).
# Remove together with the `[patch.crates-io]` entry when that engine is released.
allow-git = ["https://github.com/0xMiden/miden-debug"]
