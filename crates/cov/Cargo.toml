[package]
name = "miden-cov"
description = "Coverage reports for Miden VM programs mapped to source through package debug info"
version.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
categories.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
edition.workspace = true

[lib]
doctest = false

[dependencies]
globset.workspace = true
miden-core = { workspace = true, features = ["std"] }
miden-cov-collector = { workspace = true, features = ["std"] }
miden-debug-types = { workspace = true, features = ["std"] }
miden-mast-package = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
thiserror = { workspace = true, features = ["std"] }

[dev-dependencies]
miden-assembly = { workspace = true, features = ["std"] }
miden-core-lib = { workspace = true, features = ["std"] }
miden-debug-engine.workspace = true
miden-processor = { workspace = true, features = ["std"] }
tempfile.workspace = true
