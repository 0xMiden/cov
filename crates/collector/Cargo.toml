[package]
name = "miden-cov-collector"
description = "Execution coverage collection for Miden VM programs"
version.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
categories.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
edition.workspace = true

[lib]
doctest = false

[features]
default = ["std"]
std = [
    "miden-core/std",
    "miden-mast-package/std",
    "miden-processor/std",
]

[dependencies]
miden-core.workspace = true
miden-debug-engine = { workspace = true, default-features = false }
miden-mast-package.workspace = true
miden-processor.workspace = true

[dev-dependencies]
miden-assembly = { workspace = true, features = ["std"] }
miden-mast-package = { workspace = true, features = ["std"] }
tempfile.workspace = true
