[package]
name = "miden-cov-cli"
description = "Command-line interface for collecting and reporting Miden VM code coverage"
version.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
categories.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
edition.workspace = true

[[bin]]
name = "miden-cov"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap = { workspace = true, features = ["env"] }
miden-cov.workspace = true
miden-cov-collector = { workspace = true, features = ["std"] }
miden-debug-engine.workspace = true
miden-mast-package = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }

[dev-dependencies]
miden-assembly = { workspace = true, features = ["std"] }
miden-core-lib = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
tempfile.workspace = true
